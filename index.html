<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <text y='.9em' font-size='90'>🏡</text>
</svg>"
    />
    <title>Housewarming Invitation</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        height: 100vh;
        overflow: hidden;
      }

      .bg {
        position: fixed;
        width: 100%;
        height: 100%;
        background: url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c")
          center/cover no-repeat;
        z-index: -2;
      }

      .overlay {
        position: fixed;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.55);
        z-index: -1;
      }

      .particle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: white;
        border-radius: 50%;
        opacity: 0.6;
        animation: float 12s linear infinite;
      }

      @keyframes float {
        from { transform: translateY(100vh); }
        to { transform: translateY(-10vh); }
      }

      /* dropdown */
      .lang {
        position: fixed;
        top: 20px;
        right: 20px;
      }

      .lang select {
        padding: 6px 12px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
      }

      .card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 380px;
        padding: 30px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        color: #fff;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }

      .title { font-size: 26px; font-weight: bold; }
      .name { margin: 10px 0; font-weight: bold; }
      .text { margin-top: 8px; font-size: 14px; opacity: 0.9; }
      .info { margin-top: 12px; }
      .address { margin-top: 10px; font-size: 14px; }
      .footer { margin-top: 12px; font-size: 13px; opacity: 0.8; }

      .countdown {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        padding: 10px 18px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 12px;
        text-align: center;
      }

      .countdown div span {
        display: block;
        font-size: 18px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="bg"></div>
    <div class="overlay">
      <div class="countdown">
        <div><span id="days">0</span>Days</div>
        <div><span id="hours">0</span>Hrs</div>
        <div><span id="minutes">0</span>Min</div>
        <div><span id="seconds">0</span>Sec</div>
      </div>
    </div>

    <script>
      for (let i = 0; i < 30; i++) {
        let p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = 6 + Math.random() * 10 + "s";
        document.body.appendChild(p);
      }

      document.addEventListener("DOMContentLoaded", function () {
        const eventStart = new Date(2026, 4, 29, 6, 0, 0).getTime();
        const eventEnd = new Date(2026, 4, 29, 9, 0, 0).getTime();

        function updateCountdown() {
          const now = new Date().getTime();
          const box = document.querySelector(".countdown");

          if (!box) return;

          if (now >= eventStart && now <= eventEnd) {
            box.innerHTML = "🎉 Ceremony is ONGOING 🎉";
            return;
          }

          if (now > eventEnd) {
            box.innerHTML = "🙏 Ceremony Completed";
            return;
          }

          const diff = eventStart - now;

          document.getElementById("days").innerText =
            Math.floor(diff / (1000 * 60 * 60 * 24));
          document.getElementById("hours").innerText =
            Math.floor((diff / (1000 * 60 * 60)) % 24);
          document.getElementById("minutes").innerText =
            Math.floor((diff / (1000 * 60)) % 60);
          document.getElementById("seconds").innerText =
            Math.floor((diff / 1000) % 60);
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
      });
    </script>

    <!-- DROPDOWN -->
    <div class="lang">
      <select id="langSelect" onchange="setLang(this.value)">
        <option value="ta">தமிழ்</option>
        <option value="en">English</option>
        <option value="kn">ಕನ್ನಡ</option>
      </select>
    </div>

    <div class="card">
      <div class="title" id="title"></div>
      <div class="text" id="welcomeLine"></div>
      <div id="line1"></div>
      <div class="name" id="name"></div>
      <div id="line2"></div>
      <div class="info" id="info"></div>
      <div class="address" id="address"></div>
      <div class="text" id="meal"></div>
      <div class="footer" id="footer"></div>
    </div>

    <script>
      function setLang(lang) {

        if (lang === "en") {
          title.innerText = "🏡 House Warming";
          welcomeLine.innerText =
            "We are delighted to invite you to celebrate this special occasion with us.";
          line1.innerText = "With love,";
          name.innerText = "Rajagopal & Family";
          line2.innerText = "invite you to our new home ceremony";

          info.innerHTML =
            "<b>Date:</b> May 29, 2026<br><b>Time:</b> 6:00 AM – 9:00 AM";
          address.innerHTML =
            "📍 25/3, Old Sunnabhukara Street<br>Musiri, Trichy, TN - 621211";
          meal.innerText = "Breakfast will be served after the ceremony.";
          footer.innerText =
            "Your presence and blessings mean a lot to us 🙏";

        } else if (lang === "ta") {
          title.innerText = "🏡 புதுமனை புகுவிழா";
          welcomeLine.innerText =
            "இந்த இனிய நிகழ்வில் தங்களை அன்புடன் வரவேற்கிறோம்.";
          line1.innerText = "அன்புடன்";
          name.innerText = "ராஜகோபால் & குடும்பத்தினர்";
          line2.innerText =
            "எங்கள் புதிய இல்ல விழாவிற்கு அழைக்கிறோம்";

          info.innerHTML =
            "<b>தேதி:</b> மே 29, 2026<br><b>நேரம்:</b> காலை 6:00 – 9:00";
          address.innerHTML =
            "📍 25/3, பழைய சுண்ணாம்புக்கார தெரு<br>முசிறி, திருச்சி, TN - 621211";
          meal.innerText =
            "நிகழ்ச்சி முடிவில் காலை உணவு வழங்கப்படும்.";
          footer.innerText =
            "தங்களின் வருகை மற்றும் ஆசீர்வாதம் எங்களுக்கு மகிழ்ச்சி தரும் 🙏";

        } else if (lang === "kn") {
          title.innerText = "🏡 ಗೃಹ ಪ್ರವೇಶ";
          welcomeLine.innerText =
            "ಈ ಶುಭ ಸಂದರ್ಭದಲ್ಲಿ ನಮ್ಮೊಂದಿಗೆ ಸೇರಲು ನಿಮಗೆ ಹೃತ್ಪೂರ್ವಕ ಆಹ್ವಾನ.";
          line1.innerText = "ಪ್ರೀತಿಯಿಂದ";
          name.innerText = "ರಾಜಗೋಪಾಲ್ & ಕುಟುಂಬ";
          line2.innerText =
            "ನಮ್ಮ ಹೊಸ ಮನೆಯ ಕಾರ್ಯಕ್ರಮಕ್ಕೆ ನಿಮ್ಮನ್ನು ಆಹ್ವಾನಿಸುತ್ತೇವೆ";

          info.innerHTML =
            "<b>ದಿನಾಂಕ:</b> ಮೇ 29, 2026<br><b>ಸಮಯ:</b> ಬೆಳಿಗ್ಗೆ 6:00 – 9:00";
          address.innerHTML =
            "📍 25/3, ಹಳೆಯ ಸುಣ್ಣಾಂಬುಕಾರೆ ರಸ್ತೆ<br>ಮುಸಿರಿ, ತಿರುಚಿ, TN - 621211";
          meal.innerText =
            "ಕಾರ್ಯಕ್ರಮದ ನಂತರ ಉಪಹಾರ ವ್ಯವಸ್ಥೆ ಇದೆ.";
          footer.innerText =
            "ನಿಮ್ಮ ಉಪಸ್ಥಿತಿ ಮತ್ತು ಆಶೀರ್ವಾದ ನಮಗೆ ಸಂತೋಷ ತರುತ್ತದೆ 🙏";
        }
      }

      window.onload = function () {
        document.getElementById("langSelect").value = "ta";
        setLang("ta");
      };
    </script>
  </body>
</html>
