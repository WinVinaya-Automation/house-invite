<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Housewarming invitation ceremony on May 29, 2026."
    />

    <title>Housewarming Invitation</title>

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='.9em' font-size='90'>🏡</text>
</svg>"
    />

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        height: 100vh;
        overflow: hidden;
        background: #000;
        color: #fff;
      }

      .bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c")
          center/cover no-repeat;
        z-index: -2;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.55);
        z-index: -1;
      }

      .particle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: white;
        border-radius: 50%;
        opacity: 0.6;
        animation: float 12s linear infinite;
        pointer-events: none;
      }

      @keyframes float {
        from {
          transform: translateY(100vh);
        }

        to {
          transform: translateY(-10vh);
        }
      }

      .lang {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 999;
      }

      .lang label {
        position: absolute;
        left: -9999px;
      }

      .lang select {
        padding: 6px 12px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
      }

      .card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 380px;
        padding: 30px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        color: #fff;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }

      .title {
        font-size: 26px;
        font-weight: bold;
        margin: 0;
      }

      .name {
        margin: 10px 0;
        font-weight: bold;
      }

      .text {
        margin-top: 8px;
        font-size: 14px;
        opacity: 0.9;
      }

      .info {
        margin-top: 12px;
      }

      .address {
        margin-top: 10px;
        font-size: 14px;
        font-style: normal;
      }

      .address a {
        color: #ffffff;
        text-decoration: none;
      }

      .footer {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.8;
      }

      .countdown {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        padding: 10px 18px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 12px;
        text-align: center;
        z-index: 999;
      }

      .countdown div span {
        display: block;
        font-size: 18px;
        font-weight: bold;
      }

      /* Accessibility */
      .sr-only {
        position: absolute;
        left: -9999px;
      }

      .skip-link {
        position: absolute;
        left: -9999px;
        top: 10px;
        background: #ffffff;
        color: #000000;
        padding: 8px 14px;
        border-radius: 6px;
        z-index: 9999;
        text-decoration: none;
      }

      .skip-link:focus {
        left: 10px;
      }

      select:focus-visible,
      a:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .particle {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Skip Link -->
    <a
      href="#main-content"
      class="sr-only skip-link"
    >
      Skip to main content
    </a>

    <!-- Background -->
    <div
      class="bg"
      aria-hidden="true"
    ></div>

    <div
      class="overlay"
      aria-hidden="true"
    >
      <!-- Countdown -->
      <div
        class="countdown"
        role="timer"
        aria-live="polite"
        aria-label="Event countdown"
        aria-atomic="true"
      >
        <div>
          <span id="days">0</span>
          Days
        </div>

        <div>
          <span id="hours">0</span>
          Hrs
        </div>

        <div>
          <span id="minutes">0</span>
          Min
        </div>

        <div>
          <span id="seconds">0</span>
          Sec
        </div>
      </div>
    </div>

    <script>
      // Particles
      for (let i = 0; i < 30; i++) {
        let p = document.createElement("div");

        p.className = "particle";

        p.setAttribute(
          "aria-hidden",
          "true"
        );

        p.style.left =
          Math.random() * 100 + "%";

        p.style.animationDuration =
          6 + Math.random() * 10 + "s";

        document.body.appendChild(p);
      }

      // Countdown
      function updateCountdown() {
        const now = new Date();

        const box =
          document.querySelector(
            ".countdown"
          );

        if (!box) return;

        const start = new Date(
          2026,
          4,
          29,
          6,
          0,
          0
        );

        const end = new Date(
          2026,
          4,
          29,
          9,
          0,
          0
        );

        // Event ongoing
        if (
          now >= start &&
          now <= end
        ) {
          box.textContent =
            "🎉 Event is going on (May 29, 6:00 AM - 9:00 AM)";
          return;
        }

        // Event ended
        if (now > end) {
          box.textContent =
            "🙏 Event has ended";
          return;
        }

        // Countdown
        const diff = start - now;

        document.getElementById(
          "days"
        ).innerText = Math.floor(
          diff /
            (1000 * 60 * 60 * 24)
        );

        document.getElementById(
          "hours"
        ).innerText = Math.floor(
          (diff /
            (1000 * 60 * 60)) %
            24
        );

        document.getElementById(
          "minutes"
        ).innerText = Math.floor(
          (diff / (1000 * 60)) %
            60
        );

        document.getElementById(
          "seconds"
        ).innerText = Math.floor(
          (diff / 1000) % 60
        );
      }

      setInterval(
        updateCountdown,
        1000
      );

      // Language
      function setLang(lang) {
        const title =
          document.getElementById(
            "title"
          );

        const welcomeLine =
          document.getElementById(
            "welcomeLine"
          );

        const line1 =
          document.getElementById(
            "line1"
          );

        const name =
          document.getElementById(
            "name"
          );

        const line2 =
          document.getElementById(
            "line2"
          );

        const info =
          document.getElementById(
            "info"
          );

        const address =
          document.getElementById(
            "address"
          );

        const footer =
          document.getElementById(
            "footer"
          );

        // English
        if (lang === "en") {
          document.documentElement.lang =
            "en";

          title.innerText =
            "🏡 House Warming";

          welcomeLine.innerText =
            "We are delighted to invite you to celebrate this special occasion with us.";

          line1.innerText =
            "With love,";

          name.innerText =
            "Rajagopal & Family";

          line2.innerText =
            "invite you to our new home ceremony";

          info.innerHTML =
            "<b>Date:</b> May 29, 2026<br><b>Time:</b> 6:00 AM – 9:00 AM";

          address.innerHTML =
            '📍 <a href="https://maps.app.goo.gl/hv33kgygS9eMpnDKA" target="_blank" rel="noopener noreferrer" aria-label="Open location in Google Maps">25/3, Old Sunnabhukara Street<br>Musiri, Trichy, Tamil Nadu - 621211</a>';

          footer.innerText =
            "Your presence and blessings mean a lot to us 🙏";
        }

        // Tamil
        else if (lang === "ta") {
          document.documentElement.lang =
            "ta";

          title.innerText =
            "🏡 புதுமனை புகுவிழா";

          welcomeLine.innerText =
            "இந்த இனிய நிகழ்வில் தங்களை அன்புடன் வரவேற்கிறோம்.";

          line1.innerText =
            "அன்புடன்";

          name.innerText =
            "ராஜகோபால் & குடும்பத்தினர்";

          line2.innerText =
            "எங்கள் புதிய இல்ல விழாவிற்கு அழைக்கிறோம்";

          info.innerHTML =
            "<b>தேதி:</b> மே 29, 2026<br><b>நேரம்:</b> காலை 6:00 AM – 9:00 AM";

          address.innerHTML =
            '📍 <a href="https://maps.app.goo.gl/hv33kgygS9eMpnDKA" target="_blank" rel="noopener noreferrer" aria-label="Google Maps location">25/3, பழைய சுண்ணாம்புக்கார தெரு<br>முசிறி, திருச்சி, தமிழ்நாடு - 621211</a>';

          footer.innerText =
            "தங்களின் வருகை மற்றும் ஆசீர்வாதம் எங்களுக்கு மகிழ்ச்சி தரும் 🙏";
        }

        // Kannada
        else if (lang === "kn") {
          document.documentElement.lang =
            "kn";

          title.innerText =
            "🏡 ಗೃಹ ಪ್ರವೇಶ";

          welcomeLine.innerText =
            "ಈ ಶುಭ ಸಂದರ್ಭದಲ್ಲಿ ನಮ್ಮೊಂದಿಗೆ ಸೇರಲು ನಿಮಗೆ ಹೃತ್ಪೂರ್ವಕ ಆಹ್ವಾನ.";

          line1.innerText =
            "ಪ್ರೀತಿಯಿಂದ";

          name.innerText =
            "ರಾಜಗೋಪಾಲ್ & ಕುಟುಂಬ";

          line2.innerText =
            "ನಮ್ಮ ಹೊಸ ಮನೆಯ ಕಾರ್ಯಕ್ರಮಕ್ಕೆ ನಿಮ್ಮನ್ನು ಆಹ್ವಾನಿಸುತ್ತೇವೆ";

          info.innerHTML =
            "<b>ದಿನಾಂಕ:</b> ಮೇ 29, 2026<br><b>ಸಮಯ:</b> ಬೆಳಿಗ್ಗೆ 6:00 AM – 9:00 AM";

          address.innerHTML =
            '📍 <a href="https://maps.app.goo.gl/hv33kgygS9eMpnDKA" target="_blank" rel="noopener noreferrer" aria-label="Google Maps location">25/3, ಹಳೆಯ ಸುಣ್ಣಾಂಬುಕಾರೆ ರಸ್ತೆ<br>ಮುಸಿರಿ, ತಿರುಚಿ, ತಮಿಳುನಾಡು - 621211</a>';

          footer.innerText =
            "ನಿಮ್ಮ ಉಪಸ್ಥಿತಿ ಮತ್ತು ಆಶೀರ್ವಾದ ನಮಗೆ ಸಂತೋಷ ತರುತ್ತದೆ 🙏";
        }
      }

      // Initial Load
      window.onload = function () {
        document.getElementById(
          "langSelect"
        ).value = "ta";

        setLang("ta");

        updateCountdown();
      };
    </script>

    <!-- Language -->
    <div class="lang">
      <label
        for="langSelect"
        class="sr-only"
      >
        Select language
      </label>

      <select
        id="langSelect"
        onchange="setLang(this.value)"
        aria-label="Select language"
      >
        <option value="ta">
          தமிழ்
        </option>

        <option value="en">
          English
        </option>

        <option value="kn">
          ಕನ್ನಡ
        </option>
      </select>
    </div>

    <!-- Card -->
    <main id="main-content">
      <div
        class="card"
        role="main"
        aria-labelledby="title"
      >
        <h1
          class="title"
          id="title"
        ></h1>

        <p
          class="text"
          id="welcomeLine"
        ></p>

        <p id="line1"></p>

        <p
          class="name"
          id="name"
        ></p>

        <p id="line2"></p>

        <section
          class="info"
          id="info"
          aria-label="Event details"
        ></section>

        <address
          class="address"
          id="address"
        ></address>

        <div
          class="text"
          id="meal"
        ></div>

        <p
          class="footer"
          id="footer"
        ></p>
      </div>
    </main>
  </body>
</html>
